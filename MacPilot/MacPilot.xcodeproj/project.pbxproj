}\" \"${destination}/Resources/Models/qwen2.5-1.5b-instruct-q4_k_m.gguf\"; then\n    /bin/cp -c \"${model_source}\" \"${destination}/Resources/Models/qwen2.5-1.5b-instruct-q4_k_m.gguf\" || /bin/cp \"${model_source}\" \"${destination}/Resources/Models/qwen2.5-1.5b-instruct-q4_k_m.gguf\"\nfi\nfor item in \"${source_bundle}/Contents/Resources/Licenses/\"*; do\n    /bin/cp \"${item}\" \"${destination}/Resources/Licenses/${item##*/}\"\ndone\n";
